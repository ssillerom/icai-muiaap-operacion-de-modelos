[project]
name = "envios"
version = "1.0.0"
description = "Riesgo de retraso de envios: modelo, API FastAPI y frontend Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "joblib",
    "numpy",
    "pandas",
    "pydantic",
    "python-dotenv",
    "scikit-learn",
    "streamlit",
    "uvicorn",
]

[project.scripts]
entrenar = "envios.train:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.8,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "frontend"]
