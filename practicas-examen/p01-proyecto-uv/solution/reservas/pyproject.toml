[project]
name = "reservas"
version = "0.1.0"
description = "Modelo de riesgo de cancelacion de reservas de hotel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "pandas",
    "scikit-learn",
]

[project.scripts]
entrenar = "reservas.train:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.8,<0.11"]
build-backend = "uv_build"
