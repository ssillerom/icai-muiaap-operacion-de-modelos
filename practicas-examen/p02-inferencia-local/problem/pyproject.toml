[project]
name = "reservas"
version = "0.2.0"
description = "Modelo de riesgo de cancelacion de reservas de hotel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "pandas",
    "scikit-learn",
]

[project.scripts]
entrenar = "reservas.train:main"
# TODO: anade aqui el script "predecir" que ejecute la funcion main de reservas.predict

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.8,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
