[project]
name = "reservas"
version = "0.8.0"
description = "Modelo de riesgo de cancelacion de reservas de hotel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "joblib",
    "pandas",
    "pydantic",
    "scikit-learn",
    "streamlit",
    "uvicorn",
]

[project.scripts]
entrenar = "reservas.train:main"
predecir = "reservas.predict:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.8,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "frontend"]
